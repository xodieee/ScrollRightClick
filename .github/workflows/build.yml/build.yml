
name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Build mod
        run: |
          cd project/ScrollRightClick
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ScrollRightClick-JAR
          path: project/ScrollRightClick/build/libs/*.jar
